---
- name: Deploy VLANs on Switches
  hosts: switches
  gather_facts: no
  vars:
    vlan_list:
      - id: 10
        name: Data
      - id: 20
        name: Voice
  tasks:
    - name: Create VLANs
      cisco.ios.ios_vlans:
        config:
          - vlan_id: "{{ item.id }}"
            name: "{{ item.name }}"
            state: active
        state: merged
      loop: "{{ vlan_list }}"
